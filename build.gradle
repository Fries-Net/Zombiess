plugins {
    id 'base'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id 'xyz.jpenilla.run-paper' version '2.3.1' apply false
}

allprojects {
    group = 'net.fries.zombies'
    version = '0.1.0'
    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }
}

subprojects {
    apply plugin: 'java-library'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging { events 'failed', 'skipped' }
    }
    dependencyLocking { lockAllConfigurations() }
}

tasks.named('build') { dependsOn subprojects.collect { it.tasks.named('build') } }
tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
tasks.named('clean') { dependsOn subprojects.collect { it.tasks.named('clean') } }
