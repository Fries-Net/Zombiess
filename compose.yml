services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: zombies
      POSTGRES_USER: zombies_owner
      POSTGRES_PASSWORD: ${ZOMBIES_POSTGRES_PASSWORD:?Set ZOMBIES_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zombies_owner -d zombies"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7.4.2-alpine
    profiles: [network]
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
