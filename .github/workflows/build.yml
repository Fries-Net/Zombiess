name: Build and verify
on:
  push:
    branches: [master, 'refactor/**', 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: friesnet-zombies-java21
          path: zombies-game/build/libs/zombies-game-0.1.0.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: zombies_test
          POSTGRES_USER: zombies_test
          POSTGRES_PASSWORD: local-ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zombies_test -d zombies_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      ZOMBIES_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/zombies_test
      ZOMBIES_TEST_DATABASE_USER: zombies_test
      ZOMBIES_TEST_DATABASE_PASSWORD: local-ci-disposable-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :zombies-persistence:integrationTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-test-reports
          path: zombies-persistence/build/reports/tests/integrationTest/
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/paper-client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :zombies-game:shadowJar :zombies-game:paperIntegrationJar --no-daemon
      - run: npm ci --prefix tools/paper-client --ignore-scripts --no-audit --no-fund
      - run: python tools/paper_playtest.py --accept-eula
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-multiplayer-playtest
          path: |
            run/playtest-*/result.json
            run/playtest-*/*.log
            run/playtest-*/logs/
