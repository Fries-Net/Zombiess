language: "en_US"

mythic:
  enabled: true

game:
  starting-coins: 500
  wave-interval-seconds: 8
  start-delay-seconds: 10
  downed-bleedout-seconds: 25
  revive-base-seconds: 5
  barricade-base-ticks: 40
  skin-tokens-per-wave: 1
  max-rounds: 30
  barricade-repair-material: OAK_PLANKS
  barricade-anchor-materials:
    - IRON_BARS
    - COBBLESTONE_WALL
  spawn-points:
    - world: world
      x: 12.5
      y: 65.0
      z: -4.5
      yaw: 0.0
      pitch: 0.0
    - world: world
      x: -9.5
      y: 65.0
      z: 14.5
      yaw: 0.0
      pitch: 0.0
    - world: world
      x: -16.5
      y: 65.0
      z: -12.5
      yaw: 0.0
      pitch: 0.0
    - world: world
      x: 22.5
      y: 65.0
      z: 10.5
      yaw: 0.0
      pitch: 0.0

