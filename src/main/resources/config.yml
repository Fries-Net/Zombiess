skill-trees:
  engineer:
    display: "&eEngineer"
    skills:
      fast_hands:
        display: "&aFast Hands"
        description: "Repair barricades faster."
        type: BARRICADE_SPEED
        max-level: 5
        base-cost: 1
        value-per-level: 0.20
      bargain_builder:
        display: "&6Bargain Builder"
        description: "Reduce weapon buy price."
        type: WEAPON_DISCOUNT
        max-level: 5
        base-cost: 1
        value-per-level: 0.05
      payday:
        display: "&ePayday"
        description: "More gold from kills."
        type: COIN_GAIN
        max-level: 5
        base-cost: 1
        value-per-level: 0.08
      quick_reload:
        display: "&bQuick Reload"
        description: "Improves reload speed."
        type: RELOAD_SPEED
        max-level: 5
        base-cost: 1
        value-per-level: 0.07
  medic:
    display: "&aMedic"
    skills:
      field_revive:
        display: "&dField Revive"
        description: "Revive teammates faster."
        type: REVIVE_SPEED
        max-level: 5
        base-cost: 1
        value-per-level: 0.18
      iron_lungs:
        display: "&fIron Lungs"
        description: "Increase max health."
        type: EXTRA_HEALTH
        max-level: 5
        base-cost: 1
        value-per-level: 2.0
      support_pay:
        display: "&6Support Pay"
        description: "More gold from kills."
        type: COIN_GAIN
        max-level: 5
        base-cost: 1
        value-per-level: 0.06
      steady_hands:
        display: "&cSteady Hands"
        description: "Increase damage."
        type: DAMAGE_BOOST
        max-level: 5
        base-cost: 1
        value-per-level: 0.06
  assault:
    display: "&cAssault"
    skills:
      overclock:
        display: "&cOverclock"
        description: "Increase damage output."
        type: DAMAGE_BOOST
        max-level: 5
        base-cost: 1
        value-per-level: 0.08
      hunters_eye:
        display: "&4Hunter's Eye"
        description: "Chance to critically strike."
        type: CRIT_CHANCE
        max-level: 5
        base-cost: 1
        value-per-level: 0.05
      scavenger:
        display: "&6Scavenger"
        description: "More gold from kills."
        type: COIN_GAIN
        max-level: 5
        base-cost: 1
        value-per-level: 0.07
      battle_savings:
        display: "&eBattle Savings"
        description: "Lower weapon prices."
        type: WEAPON_DISCOUNT
        max-level: 5
        base-cost: 1
        value-per-level: 0.04

